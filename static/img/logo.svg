<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Melbourne Karaoke">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="#0d1020"/>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.6"/>
  <g filter="url(#glow)">
    <!-- mic body -->
    <rect x="49" y="30" width="22" height="40" rx="11" fill="url(#g)"/>
    <!-- mic arc -->
    <path d="M40 58 a20 20 0 0 0 40 0" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <!-- stem + base -->
    <rect x="58" y="76" width="4" height="14" rx="2" fill="url(#g)"/>
    <rect x="48" y="90" width="24" height="4" rx="2" fill="url(#g)"/>
    <!-- sound waves -->
    <path d="M30 44 q-6 16 0 32" fill="none" stroke="#2de2e6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M90 44 q6 16 0 32" fill="none" stroke="#ff3d7f" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
