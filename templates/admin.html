<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Melbourne Karaoke — Admin</title>
  <meta name="theme-color" content="#0a0c1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karaoke Admin">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bgblob"></div>

  <header class="appbar">
    <img class="logo" src="/static/img/logo.png" alt="Melbourne Karaoke"
         onerror="this.onerror=null;this.src='/static/img/icon-192.png'">
    <div class="brand"><b>Melbourne Karaoke</b><span>Admin console</span></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-icon" id="reindex" title="Rescan songs">⟳</button>
    <a href="/qr" target="_blank"><button class="btn btn-ghost">📱 QR</button></a>
    <a href="/player" target="_blank"><button class="btn btn-ghost">📺 Player</button></a>
  </header>

  <div class="wrap">
    <div id="nowPlaying" class="now idle">
      <div class="label">▶ Now playing
        <span class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="np-title" id="npTitle">Nothing playing</div>
      <div class="np-meta" id="npMeta">Press play to start the queue</div>
      <span class="statuspill stopped" id="statusPill">stopped</span>
    </div>

    <div class="transport">
      <button class="tbtn main" id="play" title="Play">▶</button>
      <button class="tbtn" id="pause" title="Pause">⏸</button>
      <button class="tbtn" id="next" title="Next">⏭</button>
      <button class="tbtn" id="stop" title="Stop">⏹</button>
      <div class="vol"><span>🔊</span><input id="vol" type="range" min="0" max="1" step="0.05" value="1"></div>
    </div>
    <div class="seek-row">
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" disabled>
      <span id="seekTime">0:00 / 0:00</span>
    </div>

    <div class="section-title">Queue <span id="qcount" style="margin-left:6px;color:var(--cyan)"></span></div>
    <div id="queue" class="list"></div>
  </div>

  <div id="toast"></div>
  <script>window.NEEDS_AUTH = {{ auth|default(false)|tojson }};</script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
