<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melbourne Karaoke — Scan to request</title>
  <link rel="icon" href="/static/img/logo.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .poster {
      max-width: 520px; margin: 30px auto; text-align: center;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 28px; padding: 34px 28px; box-shadow: var(--shadow);
      animation: cardIn .6s ease both;
    }
    .poster img.logo { height: 64px; margin-bottom: 10px;
      filter: drop-shadow(0 0 14px rgba(255,61,127,.6)); }
    .poster h1 { margin: 6px 0 2px; font-size: 26px;
      background: var(--grad); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; }
    .poster .sub { color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: 12px; }
    .qcard { background: #fff; border-radius: 22px; padding: 22px; margin: 22px auto; width: max-content; box-shadow: var(--glow-cyan); }
    .qcard img { display: block; width: 280px; height: 280px; }
    .scan { font-size: 22px; font-weight: 800; margin-top: 6px; }
    .url { color: var(--cyan); word-break: break-all; font-size: 15px; margin-top: 8px; }
    .steps { color: var(--muted); margin-top: 14px; font-size: 14px; line-height: 1.7; }
    .noprint { margin-top: 22px; }
    @media print {
      body { background: #fff; }
      body::before, body::after, .bgblob { display: none; }
      .poster { box-shadow: none; border: none; color: #000; }
      .poster h1 { -webkit-text-fill-color: #d6246b; }
      .poster .sub, .steps { color: #444; }
      .url { color: #0a7; }
      .noprint { display: none; }
    }
  </style>
</head>
<body>
  <div class="bgblob"></div>
  <div class="poster">
    <img class="logo" src="/static/img/logo.png" alt="Melbourne Karaoke"
         onerror="this.onerror=null;this.src='/static/img/logo.svg'">
    <h1>Melbourne Karaoke</h1>
    <div class="sub">Live song requests</div>

    <div class="qcard"><img src="/qr.svg" alt="Scan to request a song"></div>

    <div class="scan">📱 Scan to request a song</div>
    <div class="url">{{ url }}</div>
    <div class="steps">
      1. Open your phone camera &nbsp;·&nbsp; 2. Point at the code<br>
      3. Tap the link &nbsp;·&nbsp; 4. Search &amp; add your song 🎶
    </div>

    <div class="noprint">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print this poster</button>
    </div>
  </div>
</body>
</html>
