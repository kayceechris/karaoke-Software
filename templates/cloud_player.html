<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melbourne Karaoke — Cloud Player</title>
  <link rel="icon" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/css/style.css">
  {% if r2_base_url %}
  <!-- Warm the connection to R2 up front so video doesn't pay the TLS/TCP
       handshake cost when a song actually starts playing. -->
  <link rel="preconnect" href="{{ r2_base_url }}" crossorigin>
  <link rel="dns-prefetch" href="{{ r2_base_url }}">
  {% endif %}
  <style>
    html, body { height:100%; background:#000; overflow:hidden; }
    #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    video { max-width:100%; max-height:100%; background:#000; }
    canvas { image-rendering:pixelated; height:100%; aspect-ratio:300/216; background:#000; }
    #idle { color:#556; text-align:center; font-size:24px; font-family:"Segoe UI",sans-serif; padding:0 24px; }
    #overlay { position:fixed; left:0; right:0; bottom:0; padding:18px 26px;
      background:linear-gradient(transparent, rgba(0,0,0,.85)); color:#fff;
      font-family:"Segoe UI",sans-serif; font-size:26px; text-shadow:0 2px 6px #000; }
    #overlay small { color:#2de2e6; font-size:16px; letter-spacing:1px; text-transform:uppercase; display:block; }
    #mutedTag { position:fixed; top:14px; right:14px; background:rgba(0,0,0,.6); color:#2de2e6;
      font:700 12px/1 "Segoe UI",sans-serif; padding:8px 12px; border-radius:999px; letter-spacing:1px;
      text-transform:uppercase; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="idle">🎤 Ready — waiting for a song</div>
    <video id="video" style="display:none" playsinline muted preload="auto"></video>
    <canvas id="cdg" style="display:none"></canvas>
    <audio id="audio" style="display:none" muted preload="auto"></audio>
  </div>
  <div id="overlay" style="display:none"><small id="singer"></small><span id="title"></span></div>
  <div id="mutedTag">🔇 Muted — sound plays from the venue speakers</div>

  <script src="/static/js/cdg.js"></script>
  <script src="/static/js/cloud_player.js"></script>
</body>
</html>
